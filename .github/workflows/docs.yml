name: Documentation

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

on:
  push:
    branches: [ nicu1989-patch-4 ]

jobs:
  docs-pipeline:
    uses: nicu1989/cicd-workflows/.github/workflows/docs4.yml@main
    permissions:
      contents: write
      pages: write
      pull-requests: write
      id-token: write
    with:
      # Keep your runtime args for final HTML build here:
      bazel-docs-build-target: "//:docs -- --github_user=${{ github.repository_owner }} --github_repo=${{ github.event.repository.name }}"
      bazel-target: "//:docs -- --github_user=${{ github.repository_owner }} --github_repo=${{ github.event.repository.name }}"
      # You can override these if your repo uses different targets
      bazel-docs-verify-target: "//:docs_check"
      bazel-tests-target: "//..."
      retention-days: 3
      deployment_type: "workflow"
